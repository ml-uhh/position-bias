[project]
name = "residual-aware-position-bias"
version = "1.0.0"
description = "Reproduction code for residual-aware position-bias experiments"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "accelerate>=1.12.0",
  "datasets>=4.4.2",
  "einops>=0.8.1",
  "huggingface-hub>=0.36.2",
  "jaxtyping>=0.3.5",
  "matplotlib>=3.10.8",
  "numpy>=2.2.0",
  "pydantic>=2.12.5",
  "pydantic-yaml>=1.6.0",
  "scienceplots>=2.2.0",
  "scipy>=1.17.0",
  "structlog>=25.5.0",
  "torch>=2.9.1,<3",
  "tqdm>=4.67.0",
  "transformers>=4.57.3,<5",
  "typer>=0.21.1",
  "wandb>=0.23.1",
]

[dependency-groups]
dev = ["pytest>=8.4.0", "ruff>=0.12.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F722", "F821"]
